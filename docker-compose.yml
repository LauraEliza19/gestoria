services:
  security-init:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /project
    volumes:
      - .:/project
    command: python scripts/configure_security.py
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestoria}
      POSTGRES_USER: ${POSTGRES_USER:-gestoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestoria_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gestoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestoria} -d ${POSTGRES_DB:-gestoria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gestoria}:${POSTGRES_PASSWORD:-gestoria_dev}@db:5432/${POSTGRES_DB:-gestoria}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      DEMO_ORGANIZATION: ${DEMO_ORGANIZATION:-Empresa Demo GestorIA}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@gestoria.dev}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-GestorIA@123}
      FRONTEND_DIR: /workspace/frontend
      OPERATION_SIGNING_KEYS: ${OPERATION_SIGNING_KEYS:-}
      OPERATION_ACTIVE_KEY_ID: ${OPERATION_ACTIVE_KEY_ID:-v1}
      OPERATION_TTL_SECONDS: ${OPERATION_TTL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/workspace/frontend:ro
    command: >-
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  gestoria_postgres_data:
