services:
  loki:
    image: grafana/loki:3.6.20
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - gestoria_loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - gestoria_alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./deploy/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/observability/secrets/gmail_app_password:/run/secrets/gmail_app_password:ro
      - gestoria_alertmanager_data:/alertmanager
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - gestoria_prometheus_data:/prometheus
    depends_on:
      - api
      - blackbox
      - alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_PORT:-3000}"
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/gestoria-loki.yml:ro
      - gestoria_grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  gestoria_loki_data:
  gestoria_alloy_data:
  gestoria_grafana_data:
  gestoria_prometheus_data:
  gestoria_alertmanager_data: