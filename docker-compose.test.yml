services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestoria_test
      POSTGRES_USER: gestoria_test
      POSTGRES_PASSWORD: test_only_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestoria_test -d gestoria_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://gestoria_test:test_only_password@test-db:5432/gestoria_test
      TEST_POSTGRES_URL: postgresql+psycopg://gestoria_test:test_only_password@test-db:5432/gestoria_test
    depends_on:
      test-db:
        condition: service_healthy
